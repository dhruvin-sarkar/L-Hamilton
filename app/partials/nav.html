    <a class="sr-only" href="#main">Skip to content</a>

    <!-- =========================================================== HERO
         Layout mirrors the reference exactly:
           top-left   STORE pill
           top-centre monogram, then wordmark + team stamp
           top-right  menu button
           bottom-l   next race card
           bottom-r   tap-to-lock control
    -->
    <!-- Nav: wordmark left, monogram centre, store + menu right.
         Heights and paddings are the reference's, in rem.

         It lives OUTSIDE the hero and is fixed, as the reference's is. That is
         structural, not stylistic: the nav has to paint above the menu overlay
         so the close button stays reachable, and `.hero` sets
         `isolation: isolate`, which opens a stacking context that would trap
         any z-index set on a descendant inside the hero. Nested here, the nav
         disappeared entirely the moment the menu opened. -->
    <div class="nav-inner">
          <h1 class="wordmark hero-in">
            <span class="wordmark__first">Lewis</span>
            <span class="wordmark__last">Hamilton</span>
          </h1>

          <!-- Monogram. The reference runs a Rive animation in this slot; this
               is the SVG + GSAP equivalent. Paths were traced from the supplied
               artwork, so the mark is 452 bytes of vector rather than a 2MB
               raster, crisp at any size and addressable per-shape.

               The fill is a gradient in USER SPACE across the whole viewBox, not
               per-path object space, so the colour change reads as one liquid
               level rising through the mark rather than three shapes
               recolouring in step. -->
          <a class="monogram hero-in" href="/index.html" aria-label="Lewis Hamilton — home">
            <svg class="monogram__svg" viewBox="0 0 464 501" aria-hidden="true">
              <defs>
                <linearGradient
                  id="lh-fill"
                  gradientUnits="userSpaceOnUse"
                  x1="0"
                  y1="501"
                  x2="0"
                  y2="0"
                >
                  <!-- Two stops a hair apart: that gap is the meniscus. Both
                       offsets are driven together by GSAP so the pair travels
                       as a single edge. -->
                  <stop class="monogram__stop-fill" offset="0" />
                  <stop class="monogram__stop-base" offset="0.05" />
                </linearGradient>
              </defs>
              <!-- id + currentColor so the mark can be re-used by reference
                   below the hero rather than having the path data written out a
                   second time. The nav's gradient fill goes back on in CSS,
                   which beats a presentation attribute — and only reaches this
                   original, never the <use> clone. -->
              <g id="lh-mark" fill="currentColor">
                <path
                  d="M84 0 L148 61 L87 350 L86 365 L89 369 L95 371 L254 370 L240 442 L38 442 L25 439 L16 434 L2 416 L0 390 L5 359 L53 132 L84 1 Z"
                />
                <path
                  d="M381 63 L453 63 L462 66 L463 74 L437 191 L379 498 L378 500 L374 497 L308 436 L336 291 L268 290 L283 213 L350 212 L352 210 L381 64 Z"
                />
                <path d="M226 64 L295 64 L248 292 L176 292 L225 65 Z" />
              </g>
            </svg>
          </a>

          <div class="topbar hero-in">
            <a class="store" href="https://store.lewishamilton.com" target="_blank" rel="noopener">
              <svg class="store__icon" viewBox="0 0 16 16" aria-hidden="true">
                <path
                  d="M3 5h10l-.8 9H3.8L3 5Zm2.5 0V3.6a2.5 2.5 0 0 1 5 0V5"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.4"
                />
              </svg>
              <!-- Two copies, deliberately. The visible one is split into
                   per-character spans at runtime and is aria-hidden, because a
                   screen reader reading "S t o r e" as five nodes is not a
                   label. The sr-only copy is the real accessible name. This is
                   the reference's own arrangement: a `screen-reader` div beside
                   a `split-text="chars"` div carrying one span per letter. -->
              <span class="sr-only">Store</span>
              <span class="btn-text" aria-hidden="true" data-split-chars>Store</span>
            </a>
            <!-- The reference runs a Rive state machine here. This is the
                 SVG + GSAP equivalent, built to its measured artboard: a 66px
                 icon inside an 80px target, two ~16.3px bars staggered +/-6.05
                 either side of centre at y 29.2 and 38.8. The bars are equal
                 length and offset horizontally — not unequal lengths.

                 The outline is part of the icon, not a CSS border: on the
                 reference it is drawn inside the canvas, so it has to share the
                 bars' clock or the two visibly desync mid-morph.

                 The `d` values below are the no-JS fallback. mountMenuButton()
                 rewrites them from the same generator that produces the loop
                 and cross states, so all three share one command structure. -->
            <button class="menu-btn" type="button" aria-expanded="false" aria-controls="menu">
              <span class="sr-only" data-menu-label>Open menu</span>
              <svg class="menu-btn__icon" viewBox="0 0 66 66" aria-hidden="true">
                <defs>
                  <!-- The monogram's liquid fill again, same mechanism: two
                       stops a constant gap apart, driven together from main.ts
                       so the pair travels as one edge up the button. -->
                  <linearGradient
                    id="menu-liquid"
                    gradientUnits="userSpaceOnUse"
                    x1="0"
                    y1="66"
                    x2="0"
                    y2="0"
                  >
                    <stop class="menu-btn__stop-fill" offset="0" />
                    <stop class="menu-btn__stop-base" offset="0.05" />
                  </linearGradient>
                </defs>
                <rect class="menu-btn__frame" x="0" y="0" width="66" height="66" rx="13" />
                <path
                  class="menu-btn__bar"
                  data-menu-bar="1"
                  d="M30.9 29.2C32.26 29.2 33.62 29.2 34.98 29.2C36.33 29.2 37.69 29.2 39.05 29.2C40.41 29.2 41.77 29.2 43.13 29.2C44.48 29.2 45.84 29.2 47.2 29.2"
                />
                <path
                  class="menu-btn__bar"
                  data-menu-bar="2"
                  d="M18.8 38.8C20.16 38.8 21.52 38.8 22.88 38.8C24.23 38.8 25.59 38.8 26.95 38.8C28.31 38.8 29.67 38.8 31.03 38.8C32.38 38.8 33.74 38.8 35.1 38.8"
                />
              </svg>
            </button>
          </div>
    </div>

    <!-- The scroll position, on the right edge: the reference's
         `.scroll-indicator`. A track 80vh tall from 10vh down, and a bar sized
         to the share of the page on screen. Out of sight at rest; it fades up
         while the page moves and away half a second after it stops (lib/chrome.ts).
         Decorative — the scrollbar's job is done by the page itself for
         assistive tech. -->
    <div class="scroll-indicator" aria-hidden="true">
      <div class="scroll-indicator__bar"></div>
    </div>

    <!-- A phone turned on its side: the reference's `.mob-landscape-block`. The
         site is laid out for a phone held upright, so in landscape it asks to be
         turned back, over everything. Shown by CSS alone (a coarse pointer, a
         landscape viewport no taller than a phone's); the wheel's steering loop
         is started and stopped with it from lib/chrome.ts.

         The reference animates a steering wheel in its hands in a Rive file.
         This one is drawn here: an original line drawing of a wheel, its display
         carrying the LH mark. Site copy, the reference's own line. -->
    <div class="landscape-block" role="alert">
      <svg class="landscape-block__wheel" viewBox="0 0 200 200" aria-hidden="true">
        <g class="landscape-block__steer">
          <!-- Grips -->
          <path class="landscape-block__grip" d="M38 70c-14 2-24 14-24 34l2 38c1 12 11 18 21 14l14-6c8-4 11-11 10-20l-4-40c-2-14-9-22-19-20Z" />
          <path class="landscape-block__grip" d="M162 70c14 2 24 14 24 34l-2 38c-1 12-11 18-21 14l-14-6c-8-4-11-11-10-20l4-40c2-14 9-22 19-20Z" />
          <!-- Body -->
          <path class="landscape-block__body" d="M44 66c10-10 30-16 56-16s46 6 56 16c8 8 10 20 8 34l-4 26c-2 14-12 22-26 22H66c-14 0-24-8-26-22l-4-26c-2-14 0-26 8-34Z" />
          <!-- Display, with the mark -->
          <rect class="landscape-block__screen" x="76" y="62" width="48" height="32" rx="4" />
          <use href="#lh-mark" class="landscape-block__mark" transform="translate(92 67) scale(0.0355)" />
          <!-- Rotaries and buttons -->
          <circle cx="80" cy="116" r="8" /><path d="M80 110v6" />
          <circle cx="100" cy="120" r="8" /><path d="M100 114v6" />
          <circle cx="120" cy="116" r="8" /><path d="M120 110v6" />
          <circle cx="60" cy="84" r="4" /><circle cx="58" cy="98" r="4" /><circle cx="60" cy="112" r="4" />
          <circle cx="140" cy="84" r="4" /><circle cx="142" cy="98" r="4" /><circle cx="140" cy="112" r="4" />
          <!-- Paddles behind the rim -->
          <path d="M70 148l-6 18M130 148l6 18" />
          <!-- Gloved hands on the grips, forearms running out of the frame -->
          <g class="landscape-block__hand">
            <path d="M22 86c-8 4-12 12-11 22l3 30c1 8 5 13 11 15l4 47h34l-4-52c6-5 8-12 6-20l-5-28c-2-11-9-17-18-17Z" />
            <path fill="none" d="M24 98c8-1 16 1 22 5M22 112c8-1 16 1 23 5M22 126c8-1 16 1 23 5" />
          </g>
          <g class="landscape-block__hand" transform="translate(200 0) scale(-1 1)">
            <path d="M22 86c-8 4-12 12-11 22l3 30c1 8 5 13 11 15l4 47h34l-4-52c6-5 8-12 6-20l-5-28c-2-11-9-17-18-17Z" />
            <path fill="none" d="M24 98c8-1 16 1 22 5M22 112c8-1 16 1 23 5M22 126c8-1 16 1 23 5" />
          </g>
        </g>
      </svg>
      <p class="landscape-block__text">
        Please rotate your device,<br />
        <span class="landscape-block__serif">This is a vertical drive.</span>
      </p>
    </div>

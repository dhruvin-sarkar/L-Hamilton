      <section class="socials" aria-labelledby="socials-h">
        <!-- The ornament above the heading. The reference runs a 56x56 Rive
             "icon-ball" here; this is the SVG equivalent, the same substitution
             already made for the monogram and the menu button. Artwork is
             generated by tools/gen-dot-ball.py — a dot sphere, original, not
             traced. Painted as a mask over currentColor so it takes the
             section's ink rather than carrying a colour of its own. -->
        <span class="socials__ball" aria-hidden="true"></span>

        <h2 class="socials__title" id="socials-h">
          <span class="socials__title-line reveal-text">What&rsquo;s up</span>
          <span class="socials__title-line is-serif reveal-text">On Socials</span>
        </h2>

        <!-- Decorative: a collage of photography with no caption and no
             destination of its own. The links below are the content. -->
        <div class="socials__fan" aria-hidden="true">
          <div class="socials__card" data-step="-3">
            <img src="/assets/socials/social-01.webp" width="760" height="949" alt=""
              loading="lazy" decoding="async" />
          </div>
          <div class="socials__card" data-step="-2">
            <img src="/assets/socials/social-02.webp" width="760" height="1013" alt=""
              loading="lazy" decoding="async" />
          </div>
          <div class="socials__card" data-step="-1">
            <img src="/assets/socials/social-03.webp" width="760" height="951" alt=""
              loading="lazy" decoding="async" />
          </div>
          <div class="socials__card" data-step="0">
            <img src="/assets/socials/social-04.webp" width="760" height="950" alt=""
              loading="lazy" decoding="async" />
          </div>
          <div class="socials__card" data-step="1">
            <img src="/assets/socials/social-05.webp" width="760" height="1013" alt=""
              loading="lazy" decoding="async" />
          </div>
          <div class="socials__card" data-step="2">
            <img src="/assets/socials/social-06.webp" width="760" height="1013" alt=""
              loading="lazy" decoding="async" />
          </div>
          <div class="socials__card" data-step="3">
            <img src="/assets/socials/social-07.webp" width="760" height="1013" alt=""
              loading="lazy" decoding="async" />
          </div>
        </div>

        <p class="socials__follow reveal-text">Follow Lewis on social media</p>

        <!-- PLACEHOLDER LINKS, exactly as the menu's are and for the same
             reason: pointing these at a guessed handle would be inventing data,
             and a link that goes to the wrong account is worse than one that
             goes nowhere. Swap the hrefs once the real accounts are confirmed. -->
        <ul class="socials__links">
          <li>
            <a class="reveal-text" href="#" data-placeholder-href>
              <span class="sr-only">TikTok</span>
              <span class="btn-text" aria-hidden="true" data-split-chars>TikTok</span>
            </a>
          </li>
          <li>
            <a class="reveal-text" href="#" data-placeholder-href>
              <span class="sr-only">Instagram</span>
              <span class="btn-text" aria-hidden="true" data-split-chars>Instagram</span>
            </a>
          </li>
          <li>
            <a class="reveal-text" href="#" data-placeholder-href>
              <span class="sr-only">YouTube</span>
              <span class="btn-text" aria-hidden="true" data-split-chars>YouTube</span>
            </a>
          </li>
          <li>
            <a class="reveal-text" href="#" data-placeholder-href>
              <span class="sr-only">X</span>
              <span class="btn-text" aria-hidden="true" data-split-chars>X</span>
            </a>
          </li>
        </ul>
      </section>

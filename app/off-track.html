      rel="preload"
      href="/assets/fonts/mona-sans-latin-standard-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

      rel="preload"
      href="/assets/fonts/playfair-display-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <link rel="stylesheet" href="/src/styles/main.css" />
